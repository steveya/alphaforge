site_name: Alphaforge
site_description: Point-in-time feature graphs for financial ML
site_url: https://alphaforge.readthedocs.io/en/latest/
repo_url: https://github.com/steveya/alphaforge
repo_name: steveya/alphaforge

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_source: false
            show_signature_annotations: true
            show_root_heading: true
            show_object_full_path: false

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - "Quickstart: Dataset": getting-started/quickstart-dataset.md
      - "Quickstart: Public Web": getting-started/quickstart-public-web.md
  - Guides:
      - Dataset Spec: guides/dataset-spec.md
      - Data Sources: guides/data-sources.md
      - PIT Data: guides/pit.md
      - Development: guides/development.md
  - API:
      - Package: api/package.md
      - DataContext: api/data-context.md
      - Dataset Builder: api/dataset-builder.md
      - Dataset Spec: api/dataset-spec.md
      - PIT Accessor: api/pit-accessor.md
      - Stores: api/stores.md
      - Public Web: api/public-web.md
  - Changelog: changelog.md
